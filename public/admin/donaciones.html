<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donaciones — Administración Juntos por Flopi</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar admin-nav-bar">
      <a href="dashboard.html" class="brand">
        <span class="brand-emoji">💗</span> Admin Flopi
      </a>
      <ul class="nav-links admin-nav-links">
        <li><a href="dashboard.html" data-page="dashboard">Dashboard</a></li>
        <li><a href="eventos.html" data-page="eventos">Eventos</a></li>
        <li><a href="donaciones.html" data-page="donaciones">Donaciones</a></li>
        <li><a href="contenido.html" data-page="contenido">Contenido</a></li>
        <li><a href="administradores.html" data-page="administradores">Administradores</a></li>
      </ul>
      <div class="admin-user">
        <span id="admin-user-email" class="admin-user-email"></span>
        <button id="admin-logout-btn" class="btn btn-outline" style="padding: 6px 14px;">Salir</button>
      </div>
    </nav>
  </header>

  <main class="container section">
    <div class="section-title" style="text-align: left; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div>
        <h2 class="mt-0 mb-0">Donaciones</h2>
        <p class="mb-0">Medios de donación que se muestran en la web.</p>
      </div>
      <button type="button" id="new-donation-btn" class="btn btn-primary">+ Nuevo medio</button>
    </div>

    <div id="donations-list"></div>
  </main>

  <div id="donation-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="donation-modal-close" aria-label="Cerrar">✕</button>
      <h3 id="donation-modal-title" class="mt-0">Nuevo medio de donación</h3>
      <form id="donation-form">
        <div id="donation-form-message" class="form-message" hidden></div>

        <div class="form-row">
          <label for="donation-type">Tipo *</label>
          <select id="donation-type" name="type" required></select>
        </div>

        <div class="form-row">
          <label for="donation-title">Título *</label>
          <input type="text" id="donation-title" name="title" required maxlength="120" placeholder="Ej: Transferencia bancaria" />
        </div>

        <div class="form-row">
          <label for="donation-details">Detalle (CBU, alias, link, etc.) *</label>
          <textarea id="donation-details" name="details" required maxlength="300"></textarea>
        </div>

        <div class="form-row">
          <label for="donation-order">Orden</label>
          <input type="number" id="donation-order" name="order" min="0" step="1" value="0" />
        </div>

        <div class="form-row">
          <label for="donation-instagram">Link al posteo de Instagram (opcional)</label>
          <input type="url" id="donation-instagram" name="instagramUrl" placeholder="https://instagram.com/p/..." />
        </div>

        <div class="form-row" style="flex-direction: row; align-items: center; gap: 8px;">
          <input type="checkbox" id="donation-active" name="active" style="width: auto;" checked />
          <label for="donation-active" style="margin: 0;">Visible en la web</label>
        </div>

        <button type="submit" class="btn btn-primary" id="donation-submit-btn">Guardar</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/donaciones-admin.js"></script>
</body>
</html>
