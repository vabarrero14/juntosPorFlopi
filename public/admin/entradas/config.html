<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuración — Entradas — Administración Juntos por Flopi</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar admin-nav-bar">
      <a href="index.html" class="brand">
        <span class="brand-emoji">🎟️</span> Entradas — Flopi Fest
      </a>
      <ul class="nav-links admin-nav-links">
        <li><a href="index.html" data-page="inicio">Inicio</a></li>
        <li><a href="pedidos.html" data-page="pedidos">Pedidos</a></li>
        <li><a href="puerta.html" data-page="puerta">Puerta</a></li>
        <li><a href="venta-puerta.html" data-page="venta-puerta">Venta en puerta</a></li>
        <li data-admin-only><a href="reportes.html" data-page="reportes">Reportes</a></li>
        <li data-admin-only><a href="config.html" data-page="config">Configuración</a></li>
        <li data-admin-only><a href="personal.html" data-page="personal">Personal</a></li>
      </ul>
      <div class="admin-user">
        <span id="entradas-role-badge" class="category-tag"></span>
        <span id="admin-user-email" class="admin-user-email"></span>
        <button id="admin-logout-btn" class="btn btn-outline" style="padding: 6px 14px;">Salir</button>
      </div>
    </nav>
  </header>

  <main class="container section">
    <div class="section-title">
      <h2>Configuración del evento</h2>
      <p>Hora, lugar, precios y capacidad de Flopi Fest.</p>
    </div>

    <form id="config-form" class="form" style="max-width: 640px;">
      <div id="form-message" class="form-message" hidden></div>

      <div class="form-row">
        <label for="name">Nombre del evento *</label>
        <input id="name" name="name" required />
      </div>

      <div class="form-row">
        <label for="venue">Lugar *</label>
        <input id="venue" name="venue" required placeholder="Onkel (Bar Haus)" />
      </div>

      <div class="form-row">
        <label for="artists">Artistas (separados por coma)</label>
        <input id="artists" name="artists" placeholder="Motimine, Abel Ullon, Javier Zacher, Amado Sarabia" />
      </div>

      <div class="form-row">
        <label for="description">Descripción / bajada</label>
        <textarea id="description" name="description" rows="2" placeholder="Show solidario a beneficio de Flopi"></textarea>
      </div>

      <div class="form-row-group">
        <div class="form-row">
          <label for="date">Fecha *</label>
          <input id="date" name="date" type="date" required />
        </div>
        <div class="form-row">
          <label for="time">Hora de inicio *</label>
          <input id="time" name="time" type="time" required />
        </div>
        <div class="form-row">
          <label for="doorsOpenTime">Apertura de puertas</label>
          <input id="doorsOpenTime" name="doorsOpenTime" type="time" />
        </div>
      </div>

      <div class="form-row-group">
        <div class="form-row">
          <label for="priceEarly">Precio anticipada (Gs.) *</label>
          <input id="priceEarly" name="priceEarly" type="number" inputmode="numeric" min="0" step="1000" required />
        </div>
        <div class="form-row">
          <label for="priceDoor">Precio en puerta (Gs.) *</label>
          <input id="priceDoor" name="priceDoor" type="number" inputmode="numeric" min="0" step="1000" required />
        </div>
        <div class="form-row">
          <label for="capacity">Capacidad máxima *</label>
          <input id="capacity" name="capacity" type="number" inputmode="numeric" min="1" step="1" required />
        </div>
      </div>

      <div class="form-row">
        <label><input type="checkbox" id="salesOpen" name="salesOpen" checked /> Ventas abiertas</label>
        <p class="form-help">Destildá esto para frenar la venta de entradas anticipadas sin tocar nada más.</p>
      </div>

      <div id="issued-count-info" class="form-help" hidden></div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Guardar</button>
    </form>
  </main>

  <script type="module" src="js/config.js"></script>
</body>
</html>
