<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Venta en puerta — Entradas — Administración Juntos por Flopi</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar admin-nav-bar">
      <a href="index.html" class="brand">
        <span class="brand-emoji">🎟️</span> Entradas — Flopi Fest
      </a>
      <ul class="nav-links admin-nav-links">
        <li><a href="index.html" data-page="inicio">Inicio</a></li>
        <li><a href="pedidos.html" data-page="pedidos">Pedidos</a></li>
        <li><a href="puerta.html" data-page="puerta">Puerta</a></li>
        <li><a href="venta-puerta.html" data-page="venta-puerta">Venta en puerta</a></li>
        <li data-admin-only><a href="reportes.html" data-page="reportes">Reportes</a></li>
        <li data-admin-only><a href="config.html" data-page="config">Configuración</a></li>
        <li data-admin-only><a href="personal.html" data-page="personal">Personal</a></li>
      </ul>
      <div class="admin-user">
        <span id="entradas-role-badge" class="category-tag"></span>
        <span id="admin-user-email" class="admin-user-email"></span>
        <button id="admin-logout-btn" class="btn btn-outline" style="padding: 6px 14px;">Salir</button>
      </div>
    </nav>
  </header>

  <main class="container section">
    <div class="section-title">
      <h2>Venta en puerta</h2>
      <p>Pedido, cobro, entrada e ingreso en un solo paso.</p>
    </div>

    <div id="capacity-warning" class="form-message" hidden></div>

    <form id="quick-form" class="form" style="max-width: 480px;">
      <div id="form-message" class="form-message" hidden></div>

      <div class="form-row">
        <label for="buyerName">Nombre *</label>
        <input id="buyerName" required />
      </div>
      <div class="form-row">
        <label for="buyerPhone">Celular *</label>
        <input id="buyerPhone" required inputmode="tel" />
      </div>
      <div class="form-row">
        <label for="quantity">Cantidad de entradas *</label>
        <input id="quantity" type="number" min="1" step="1" value="1" required />
      </div>
      <div class="form-row" id="raffle-field-row" hidden>
        <label for="raffleQuantity">Números de rifa (opcional)</label>
        <input id="raffleQuantity" type="number" min="0" step="1" value="0" />
      </div>
      <div class="form-row">
        <label for="method">Cobro</label>
        <select id="method">
          <option value="cash">Efectivo</option>
          <option value="transfer">Transferencia</option>
        </select>
      </div>
      <div class="form-row" id="reference-row" hidden>
        <label for="reference">N° de comprobante / alias</label>
        <input id="reference" />
      </div>

      <p class="form-help" id="price-preview"></p>

      <button type="submit" class="btn btn-primary" id="submit-btn">Cobrar e ingresar</button>
    </form>

    <div id="result-card" class="card" hidden style="max-width: 480px; margin-top: 20px;">
      <div id="result-content"></div>
    </div>
  </main>

  <script type="module" src="js/venta-puerta.js"></script>
</body>
</html>
