<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pieza — Administración Juntos por Flopi</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar admin-nav-bar">
      <a href="dashboard.html" class="brand">
        <span class="brand-emoji">💗</span> Admin Flopi
      </a>
      <ul class="nav-links admin-nav-links">
        <li><a href="dashboard.html" data-page="dashboard">Dashboard</a></li>
        <li><a href="eventos.html" data-page="eventos">Eventos</a></li>
        <li><a href="subastas.html" data-page="subastas">Subastas</a></li>
        <li><a href="donaciones.html" data-page="donaciones">Donaciones</a></li>
        <li><a href="contenido.html" data-page="contenido">Contenido</a></li>
        <li><a href="administradores.html" data-page="administradores">Administradores</a></li>
      </ul>
      <div class="admin-user">
        <span id="admin-user-email" class="admin-user-email"></span>
        <button id="admin-logout-btn" class="btn btn-outline" style="padding: 6px 14px;">Salir</button>
      </div>
    </nav>
  </header>

  <main class="container section">
    <div class="section-title">
      <h2 id="form-title">Nueva pieza</h2>
    </div>

    <form id="item-form" class="form">
      <div id="form-message" class="form-message" hidden></div>

      <div class="form-row">
        <label for="name">Nombre *</label>
        <input type="text" id="name" name="name" required maxlength="120" placeholder="Camiseta firmada de…" />
      </div>

      <div class="form-row">
        <label for="desc">Descripción</label>
        <textarea id="desc" name="desc" maxlength="500" placeholder="Firmada por…, donada por…"></textarea>
      </div>

      <div class="form-row-group">
        <div class="form-row">
          <label for="base">Base (Gs.) *</label>
          <input type="number" id="base" name="base" required value="800000" min="0" step="1000" />
        </div>
        <div class="form-row">
          <label for="inc">Incremento mínimo (Gs.) *</label>
          <input type="number" id="inc" name="inc" required value="10000" min="1000" step="1000" />
        </div>
      </div>

      <div class="form-row-group">
        <div class="form-row">
          <label for="durationMin">Duración (min) *</label>
          <input type="number" id="durationMin" name="durationMin" required value="20" min="1" />
        </div>
        <div class="form-row">
          <label for="extendMin">Extensión anti-sniping (min) *</label>
          <input type="number" id="extendMin" name="extendMin" required value="2" min="0" />
        </div>
      </div>

      <div class="form-row">
        <label for="photo">Foto</label>
        <input type="file" id="photo" name="photo" accept="image/*" />
        <p class="form-help">Se comprime automáticamente antes de guardarse.</p>
        <img id="photo-preview" style="display:none; max-width: 220px; border-radius: 10px; margin-top: 8px;" />
      </div>

      <div style="display: flex; gap: 12px; align-items: center;">
        <button type="submit" class="btn btn-primary" id="submit-btn">Guardar</button>
        <a href="subastas.html" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </main>

  <script type="module" src="js/subasta-form.js"></script>
</body>
</html>
