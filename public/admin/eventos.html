<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar admin-nav-bar">
      <a href="dashboard.html" class="brand">
        <span class="brand-emoji">💗</span> Admin Flopi
      </a>
      <ul class="nav-links admin-nav-links">
        <li><a href="dashboard.html" data-page="dashboard">Dashboard</a></li>
        <li><a href="eventos.html" data-page="eventos">Eventos</a></li>
        <li><a href="donaciones.html" data-page="donaciones">Donaciones</a></li>
        <li><a href="contenido.html" data-page="contenido">Contenido</a></li>
        <li><a href="administradores.html" data-page="administradores">Administradores</a></li>
      </ul>
      <div class="admin-user">
        <span id="admin-user-email" class="admin-user-email"></span>
        <button id="admin-logout-btn" class="btn btn-outline" style="padding: 6px 14px;">Salir</button>
      </div>
    </nav>
  </header>

  <main class="container section">
    <div class="section-title" style="text-align: left; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div>
        <h2 class="mt-0 mb-0">Eventos</h2>

    <div class="admin-tabs" id="tabs">
      <button type="button" class="admin-tab" data-tab="pending">Pendientes</button>
      <button type="button" class="admin-tab" data-tab="approved">Aprobados</button>
      <button type="button" class="admin-tab" data-tab="rejected">Rechazados</button>
      <button type="button" class="admin-tab" data-tab="all">Todos</button>
    </div>

    <div id="events-list"></div>
  </main>

  <script type="module" src="js/eventos.js"></script>
